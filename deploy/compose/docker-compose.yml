# Arcadia local platform.
#
# This file only *runs* images. It builds nothing: each service repository builds and
# tags its own image, and compose pulls or reuses it. That keeps infra free of any
# knowledge about how a service is compiled.
#
#   cd ../../../wallet-service  && make docker      (and catalog, order, media, payment)
#   cd infra && make up
#
# Or `make images && make up` from infra, which does both.
#
# Eight containers by default, roughly 1.8 GB of RAM. Metrics are opt-in:
#
#   docker compose --profile metrics up -d     # adds Prometheus + Grafana

name: arcadia

services:
  postgres:
    # pgvector's image rather than the stock one: it is postgres:16 with the `vector` extension compiled in,
    # identical in every other respect, and the Recommendation service's semantic embeddings need the type.
    # Debian-based, so it is larger than the alpine tag it replaced — the extension has no alpine variant.
    image: pgvector/pgvector:pg16
    container_name: arcadia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcadia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcadia}
      POSTGRES_DB: arcadia
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first boot of an empty data directory. Creates one database and
      # one role per service, isolated from each other by grants.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    # Five services, so the connection budget went up with them: two Go services with pools
    # of 20 and three Python services with pools of 10. 128MB of shared buffers is still
    # ample for a development dataset.
    command: [postgres, -c, max_connections=100, -c, shared_buffers=128MB]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcadia} -d arcadia"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: arcadia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # No persistence: everything the wallet keeps here is a rate-limit window with a
    # TTL. Losing it on restart costs nothing but a cleared abuse counter, and skipping
    # the append-only file saves both memory and disk churn.
    command: [redis-server, --save, "", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 96M

  minio:
    # Pinned, and to an old release on purpose. MinIO removed the management features from the
    # community console in mid-2025 — later images serve a console that can browse objects and
    # little else. This one still has bucket, policy, user and service-account administration,
    # which is the whole reason to run a console next to a local stack.
    #
    # Verified rather than assumed: on this tag `/api/v1/buckets`, `/api/v1/policies`,
    # `/api/v1/service-accounts` and `/api/v1/admin/info` all answer with a console session.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: arcadia-minio
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The console shows a browser the URLs it hands out, so it has to be the address the
      # browser can reach — not the one the Docker network uses.
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    healthcheck:
      # MinIO's own liveness endpoint, not a TCP check: the port is open before the drives are
      # formatted, and a service that connected in that window would fail its first request.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          # MinIO is the single biggest cost of this change. It idles well under this; the
          # headroom is for the erasure-coding buffers a multipart upload allocates.
          memory: 512M

  minio-setup:
    # Runs once and exits. Creates the bucket and a scoped service account, so the services
    # never hold the root credentials — a leaked key that can only read and write one bucket is
    # a different incident from one that can delete every bucket and rewrite policy.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: arcadia-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-arcadia-media}
    entrypoint: [/bin/sh, /setup.sh]
    volumes:
      - ./minio-setup.sh:/setup.sh:ro
    restart: "no"
    deploy:
      resources:
        limits:
          # 64M was not enough: `mc admin policy attach` was OOM-killed, and because the script
          # tolerated a failing attach the stack came up with a bucket the media service could
          # not write to. mc is a Go binary that loads the whole policy set to attach one.
          memory: 192M

  kafka:
    image: docker.arvancloud.ir/bitnami/kafka:3.7
    container_name: arcadia-kafka
    restart: unless-stopped
    ports:
      # 9092 is the in-network listener; 29092 is how a client on the host reaches it.
      - "${KAFKA_PORT:-29092}:29092"
    environment:
      # KRaft mode: no ZooKeeper, so one container instead of two.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # Two advertised listeners because in-cluster clients and host clients reach the
      # broker by different names. Getting this wrong is the classic "works from the
      # container, times out from my laptop" Kafka failure.
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Auto-creation is off: each service declares the topics it owns at boot, so a
      # typo fails loudly instead of silently creating a topic nobody reads.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      # One partition per topic. Ordering per wallet is what matters and a single
      # partition guarantees it outright; parallelism is not a concern locally.
      KAFKA_CFG_NUM_PARTITIONS: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Kafka is the heaviest container here. 384MB is enough for a handful of small
      # topics and cuts the JVM's footprint roughly in half.
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640M

  wallet-service:
    # Built by `cd wallet-service && make docker`. Nothing is compiled here.
    image: arcadia/wallet-service:${WALLET_VERSION:-local}
    container_name: arcadia-wallet
    restart: unless-stopped
    ports:
      - "${WALLET_HTTP_PORT:-8080}:8080"
      - "${WALLET_GRPC_PORT:-9090}:9090"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Both transports locally: gRPC for the payment service, REST for Postman and
      # the front end.
      SERVER_MODE: both
      DATABASE_URL: postgres://wallet_user:wallet_pass@postgres:5432/arcadia_wallet?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      PAYMENT_SERVICE_GRPC: payment-service:9091
      JWT_SECRET: ${JWT_SECRET}
      # The credential this service presents when it calls the Payment Adapter. Left empty here
      # on purpose: with an empty value the wallet signs its own short-lived SERVICE token from
      # JWT_SECRET, which is what a stack with no Auth service needs. Set it to inject one from a
      # real Auth service instead.
      #
      # The knob existed and was unreachable — compose never passed it through — which is part of
      # why every bank top-up failed unauthenticated with no way to configure around it.
      SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN:-}
      GIFT_CARD_PEPPER: ${GIFT_CARD_PEPPER}
      WALLET_CURRENCY: ${WALLET_CURRENCY:-IRR}
      # Short intervals locally so a reviewer sees the background jobs actually run.
      JOB_RECONCILE_INTERVAL: 2m
      JOB_HOLD_SWEEP_INTERVAL: 1m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 128M

  payment-service:
    image: arcadia/payment-service:${PAYMENT_VERSION:-local}
    container_name: arcadia-payment
    restart: unless-stopped
    ports:
      - "${PAYMENT_HTTP_PORT:-8081}:8081"
      - "${PAYMENT_GRPC_PORT:-9091}:9091"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://payment_user:payment_pass@postgres:5432/arcadia_payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      # The sandbox provider, so a full top-up works with no bank account. Its
      # authorisation page is served at /mock-bank/pay.
      GATEWAY_KIND: mock
      GATEWAY_CALLBACK_SECRET: ${GATEWAY_CALLBACK_SECRET}
      PAYMENT_CURRENCY: ${WALLET_CURRENCY:-IRR}
      # Must be reachable by the "bank", which here is a browser on the host.
      PUBLIC_BASE_URL: http://localhost:${PAYMENT_HTTP_PORT:-8081}
      JOB_SWEEP_INTERVAL: 1m
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 128M

  auth-profile-service:
    # Auth and Profile in one deployment, as the requirements put them — two bounded contexts that
    # talk only through events, so they can be split later without touching either one's callers.
    #
    # First in the service list because everything else depends on it for identity: this is what
    # issues the tokens the other five verify. Nothing declares a `depends_on` for it, though —
    # token verification is offline, so a service can start and serve while auth is down.
    image: arcadia/auth-profile-service:${AUTH_VERSION:-local}
    container_name: arcadia-auth
    restart: unless-stopped
    ports:
      - "${AUTH_HTTP_PORT:-8085}:8085"
    environment:
      ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@postgres:5432/arcadia_auth
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PRESENCE_EVENTS: presence-events
      # The three that make its tokens acceptable to the rest of the platform. Without the issuer
      # and audience every other service answers 401 — which is what happened before they were set.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@arcadia.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      # Deliberately relaxed here, and only here. 5 registrations a minute is a sensible public
      # default and it makes the end-to-end suite impossible — it creates a handful of accounts per
      # run by design, and the limiter is per-IP, so every test comes from the same one. Surfacing
      # it as a variable is better than the suite quietly needing the limit to be off.
      RATE_LIMIT_REGISTER: ${AUTH_RATE_LIMIT_REGISTER:-200/minute}
      RATE_LIMIT_LOGIN: ${AUTH_RATE_LIMIT_LOGIN:-200/minute}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits:
          # Higher than the other Python services: this one also loads passlib/bcrypt and the
          # OpenTelemetry SDK, and runs five Kafka consumers rather than one.
          memory: 256M

  catalog-service:
    # Built by `cd catalog-service && make docker`. Nothing is compiled here.
    image: arcadia/catalog-service:${CATALOG_VERSION:-local}
    container_name: arcadia-catalog
    restart: unless-stopped
    ports:
      - "${CATALOG_HTTP_PORT:-8082}:8082"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://catalog_user:catalog_pass@postgres:5432/arcadia_catalog
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      CURRENCY: ${WALLET_CURRENCY:-IRR}
      # Read-through cache for the public games list/detail endpoints (requirement
      # 2.3's p95 target). Empty disables it; the service falls back to Postgres
      # on every read rather than refusing to boot.
      REDIS_URL: redis://redis:6379/2
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 160M

  order-service:
    image: arcadia/order-service:${ORDER_VERSION:-local}
    container_name: arcadia-order
    restart: unless-stopped
    ports:
      - "${ORDER_HTTP_PORT:-8083}:8083"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://order_user:order_pass@postgres:5432/arcadia_order
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      # Receives the platform's 30%. A real user id, so the platform's balance sits in the
      # same ledger as everybody else's and reconciliation covers it too.
      PLATFORM_USER_ID: ${PLATFORM_USER_ID}
      # Called synchronously before a purchase starts: price and existing ownership have to
      # be current at the moment of sale.
      CATALOG_BASE_URL: http://catalog-service:8082
      # Discount codes only — see the note in the order service's config.
      WALLET_BASE_URL: http://wallet-service:8080
      # Short locally so a reviewer sees the stalled-saga sweep actually run.
      SAGA_SWEEP_INTERVAL_SECONDS: 30
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      catalog-service: { condition: service_started }
      wallet-service: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 160M

  media-service:
    image: arcadia/media-service:${MEDIA_VERSION:-local}
    container_name: arcadia-media
    restart: unless-stopped
    ports:
      - "${MEDIA_HTTP_PORT:-8084}:8084"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://media_user:media_pass@postgres:5432/arcadia_media
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      # Signs download URLs. Deliberately NOT the same value as JWT_SECRET — the service
      # refuses to boot if they match.
      DOWNLOAD_SECRET: ${MEDIA_DOWNLOAD_SECRET}
      # S3 here, the filesystem by default in the service. This is the deployment where being
      # stateless is worth another container; a bare `pytest` needs nothing running.
      STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY}
      S3_BUCKET: ${MEDIA_S3_BUCKET:-arcadia-media}
      # minio-setup makes the bucket, with a scoped user that deliberately cannot create one.
      # Leaving this true would mean a typo in S3_BUCKET quietly starting an empty store.
      S3_CREATE_BUCKET: "false"
      # Only read when STORAGE_BACKEND=filesystem. Kept so switching back is one variable.
      STORAGE_ROOT: /var/lib/arcadia/media
      # Must be reachable by a browser following the URLs, not by the Docker network.
      PUBLIC_BASE_URL: http://localhost:${MEDIA_HTTP_PORT:-8084}
      S3_PUBLIC_BASE_URL: http://localhost:9000
      # Small on purpose for a laptop: the volume shares the host disk with Postgres, and
      # filling it would take the database down with it. Raise both for a real deployment.
      STORAGE_SOFT_LIMIT_BYTES: ${MEDIA_STORAGE_SOFT_LIMIT_BYTES:-5368709120}
      OWNER_QUOTA_BYTES: ${MEDIA_OWNER_QUOTA_BYTES:-1073741824}
    volumes:
      # Only used when STORAGE_BACKEND=filesystem, and kept for exactly that: switching the
      # backend back should be one variable, not a lost store.
      - media-data:/var/lib/arcadia/media
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # `service_completed_successfully`, not `service_healthy`. The bucket and the scoped user
      # have to exist before this service starts: it is configured not to create the bucket
      # itself, so starting first means failing readiness until someone restarts it.
      minio-setup: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          # Up from 160M. The S3 adapter buffers one 8 MiB part per concurrent upload before it
          # escalates to multipart, and botocore's service model is a few MB resident.
          memory: 224M

  notification-service:
    # Requirement 1.10. The platform's first terminal consumer: it subscribes to five topics,
    # produces nothing and owns no topic. Nothing depends on it, and nothing should — a service
    # whose failure stops a purchase is not a notification service.
    image: arcadia/notification-service:${NOTIFICATION_VERSION:-local}
    container_name: arcadia-notification
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_HTTP_PORT:-8086}:8086"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://notification_user:notification_pass@postgres:5432/arcadia_notification
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      # Passed explicitly rather than left to the service's defaults. They happen to match, but a
      # token this service accepts must be one every other service accepts, and that is worth
      # stating in the deployment rather than relying on six codebases agreeing by coincidence.
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
      # Two of the five belong to services that do not exist yet. Subscribed anyway: an empty
      # topic costs nothing, a consumer group on one is silent, and notifications start the day
      # Marketplace and Festival ship rather than the day somebody remembers to add them here.
      # The service creates all five plus their .dlq companions at boot — auto-creation is off on
      # the broker, and creation is idempotent, so both sides declaring a topic is the safe
      # arrangement.
      TOPIC_GAME_EVENTS: game-events
      TOPIC_PURCHASE_EVENTS: purchase-events
      TOPIC_USER_EVENTS: user-events
      TOPIC_TRADE_EVENTS: trade-events
      TOPIC_FESTIVAL_EVENTS: festival-events
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits:
          # Up from catalog's 160M: five aiokafka consumers rather than one, each with its own
          # fetch buffer and its own group membership.
          memory: 208M

  marketplace-service:
    # Requirement 1.6. The item market: developers define items, staff distribute them
    # at random, and users trade them through an order book matched every five minutes.
    #
    # The money never moves here. A match publishes SettleTradeCommand on trade-events
    # and wallet-service performs the transfer — which is why wallet already had a
    # handler for it before this service existed.
    image: arcadia/marketplace-service:${MARKETPLACE_VERSION:-local}
    container_name: arcadia-marketplace
    restart: unless-stopped
    ports:
      - "${MARKETPLACE_HTTP_PORT:-8087}:8087"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://marketplace_user:marketplace_pass@postgres:5432/arcadia_marketplace?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      # The topic wallet-service, notification-service and auth-profile-service already
      # subscribe to. Three consumers were waiting for these events before there was a
      # producer, so changing this disconnects all three at once.
      TOPIC_TRADE_EVENTS: trade-events
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
      # Read-only, for a buyer's spendable balance before a match. With SERVICE_TOKEN
      # empty the service signs its own short-lived SERVICE token from JWT_SECRET, the
      # same arrangement the wallet uses to call payment.
      WALLET_SERVICE_URL: http://wallet-service:8080
      SERVICE_TOKEN: ${MARKETPLACE_SERVICE_TOKEN:-}
      MARKETPLACE_CURRENCY: ${WALLET_CURRENCY:-IRR}
      # Requirement 1.6 says five minutes. Shortened locally so a reviewer sees the
      # matching engine actually run rather than waiting for it — POST
      # /v1/admin/matching/run triggers a pass immediately either way.
      MATCH_INTERVAL: ${MARKETPLACE_MATCH_INTERVAL:-1m}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits:
          # A Go service with one database and one periodic job.
          memory: 128M

  review-service:
    # Requirement 1.7. Buyer reviews: post, like/dislike, edit/delete by the author,
    # report for Support review. Ownership is verified synchronously against catalog
    # before a review can be posted, the same anti-corruption pattern order-service
    # uses to check a game's price and existing ownership.
    image: arcadia/review-service:${REVIEW_VERSION:-local}
    container_name: arcadia-review
    restart: unless-stopped
    ports:
      - "${REVIEW_HTTP_PORT:-8088}:8088"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 8088
      DATABASE_URL: postgresql+asyncpg://review_user:review_pass@postgres:5432/arcadia_review
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
      CATALOG_SERVICE_URL: http://catalog-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      catalog-service: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 160M

  festival-service:
    # Requirement 1.9. Platform-wide festivals: Admin selects games, Support proposes a
    # discount or a free run, the developer confirms it in Catalog, and this service
    # applies the price change once approved and tells everyone the festival started.
    image: arcadia/festival-service:${FESTIVAL_VERSION:-local}
    container_name: arcadia-festival
    restart: unless-stopped
    ports:
      - "${FESTIVAL_HTTP_PORT:-8089}:8089"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 8089
      DATABASE_URL: postgresql://festival_user:festival_pass@postgres:5432/arcadia_festival
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
      # Asked synchronously for every active user id when a festival starts, since
      # requirement 1.9 makes FestivalStarted platform-wide. A slow or unreachable
      # call degrades to an empty audience rather than blocking the festival.
      AUTH_PROFILE_BASE_URL: http://auth-profile-service:8085
      # Read-through cache for the public festivals list/detail endpoints.
      REDIS_URL: redis://redis:6379/4
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      catalog-service: { condition: service_started }
      auth-profile-service: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 160M

  community-service:
    # Requirement 1.8. Per-game forums: posts with photo/video/file attachments (via
    # media-service), comments, emoji reactions, report-and-remove. Feeds Profile's
    # top-5-posts read-model and search-service's index, both over community-events.
    image: arcadia/community-service:${COMMUNITY_VERSION:-local}
    container_name: arcadia-community
    restart: unless-stopped
    ports:
      - "${COMMUNITY_HTTP_PORT:-8091}:8091"
    environment:
      ENVIRONMENT: local
      # Case-sensitive uppercase-only, unlike every other service here (which
      # accept the platform's normal lowercase default) — same reason
      # auth-profile-service overrides it too.
      LOG_LEVEL: ${LOG_LEVEL_UPPER:-INFO}
      HTTP_PORT: 8091
      PERSISTENCE_BACKEND: postgres
      MESSAGING_BACKEND: kafka
      IDENTITY_BACKEND: jwt
      MEDIA_BACKEND: http
      CATALOG_BACKEND: http
      SEARCH_BACKEND: http
      # Also backs the explore/game feed read-through cache, not just the rate
      # limiter and idempotency store this connection served before.
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/5
      DATABASE_URL: postgresql+asyncpg://community_user:community_pass@postgres:5432/arcadia_community
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
      AUTH_SERVICE_URL: http://auth-profile-service:8085
      MEDIA_SERVICE_URL: http://media-service:8084
      CATALOG_SERVICE_URL: http://catalog-service:8082
      SEARCH_SERVICE_URL: http://search-service:8092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      media-service: { condition: service_started }
      catalog-service: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 160M

  search-service:
    # Full-text search over community posts (architecture §7.3's CQRS read side).
    # Postgres tsvector/GIN, not Elasticsearch — see the service's own README for
    # why. Consumes community-events; answers community-service with post ids only.
    image: arcadia/search-service:${SEARCH_VERSION:-local}
    container_name: arcadia-search
    restart: unless-stopped
    ports:
      - "${SEARCH_HTTP_PORT:-8092}:8092"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_PORT: 8092
      DATABASE_URL: postgresql://search_user:search_pass@postgres:5432/arcadia_search
      KAFKA_BROKERS: kafka:9092
      # Read-through cache for repeated search queries; the index itself churns
      # fast, hence the short TTL set in the service's own config default.
      REDIS_URL: redis://redis:6379/3
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 160M

  recommendation-service:
    # Requirements §3.1, the competitive differentiator. Hybrid game recommendations: content-based over
    # Catalog's genres and tags, plus item-item collaborative filtering over who bought what. Purely
    # event-driven — it consumes game-events, purchase-events and review-events and calls no sibling
    # service, so it keeps serving when Catalog and Store are both down.
    image: arcadia/recommendation-service:${RECOMMENDATION_VERSION:-local}
    container_name: arcadia-recommendation
    restart: unless-stopped
    ports:
      - "${RECOMMENDATION_HTTP_PORT:-8093}:8093"
    environment:
      APP_ENV: local
      # Uppercase-only, like community-service and auth-profile-service.
      LOG_LEVEL: ${LOG_LEVEL_UPPER:-INFO}
      PERSISTENCE_BACKEND: postgres
      MESSAGING_BACKEND: kafka
      IDENTITY_BACKEND: jwt
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/6
      DATABASE_URL: postgresql+asyncpg://recommendation_user:recommendation_pass@postgres:5432/arcadia_recommendation
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
      # The batch sweep runs on the same five-minute cadence as the marketplace matching engine, so the
      # machine is not running two unrelated schedules. POST /v1/admin/recommendations/refresh forces one,
      # which is what the end-to-end suite uses rather than waiting five minutes.
      GENERATION_ENABLED: "true"
      GENERATION_INTERVAL_SECONDS: 300
      # Which space the content half ranks in. `sparse` is genre/tag cosine and needs nothing; `dense` is
      # semantic embeddings and needs an embedding endpoint behind it. Both vectors are ingested either way,
      # so flipping this is a restart rather than a migration — which is the point of having both.
      SCORING_BACKEND: ${RECOMMENDATION_SCORING_BACKEND:-sparse}
      # Defaults to a deterministic in-process hash, which keeps the dense path runnable on a laptop with
      # no key: it recovers word overlap and nothing more. `huggingface` needs the endpoint set alongside
      # it — the service refuses to boot without one rather than leaving the catalogue silently unembedded.
      EMBEDDING_BACKEND: ${RECOMMENDATION_EMBEDDING_BACKEND:-hashing}
      EMBEDDING_ENDPOINT: ${RECOMMENDATION_EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${RECOMMENDATION_EMBEDDING_API_KEY:-}
      # Fixed in the `vector(n)` column: changing it needs a migration and a re-embedding of the catalogue.
      EMBEDDING_DIMENSIONS: ${RECOMMENDATION_EMBEDDING_DIMENSIONS:-1024}
      # Empty suits bge-m3 and all-MiniLM; the e5 family wants "query: " and ranks measurably worse
      # without it. Changing it invalidates every stored vector.
      EMBEDDING_PREFIX: ${RECOMMENDATION_EMBEDDING_PREFIX:-}
      # Writes the `reasons` on each suggestion. One call per user per sweep, never on the read path — a
      # provider outage costs a list without reasons, not a list.
      EXPLANATION_BACKEND: ${RECOMMENDATION_EXPLANATION_BACKEND:-none}
      EXPLANATION_BASE_URL: ${RECOMMENDATION_EXPLANATION_BASE_URL:-}
      EXPLANATION_API_KEY: ${RECOMMENDATION_EXPLANATION_API_KEY:-}
      EXPLANATION_MODEL: ${RECOMMENDATION_EXPLANATION_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 160M

  api-gateway:
    # Requirement 1.1. The platform's single public entry point: one origin in front of
    # ten services, so the browser needs one CORS allow-list and one address instead
    # of ten.
    #
    # Built by `cd api-gateway && make docker`.
    image: arcadia/api-gateway:${GATEWAY_VERSION:-local}
    container_name: arcadia-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The prefix each service is reached under is fixed in the gateway's code, not
      # here: a prefix is part of the platform's public contract and the frontend has
      # it compiled in, so an environment variable must not be able to change it
      # quietly. Only the internal addresses are configuration.
      AUTH_SERVICE_URL: http://auth-profile-service:8085
      WALLET_SERVICE_URL: http://wallet-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      MEDIA_SERVICE_URL: http://media-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      MARKETPLACE_SERVICE_URL: http://marketplace-service:8087
      REVIEW_SERVICE_URL: http://review-service:8088
      FESTIVAL_SERVICE_URL: http://festival-service:8089
      COMMUNITY_SERVICE_URL: http://community-service:8091
      # The frontend's origin. An allow-list rather than `*`: `*` plus a bearer token
      # means any page on the internet can call this API with a token it has phished,
      # and the browser will allow it.
      CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-600}
      # Generous, because media streams large files through here. A 30-second cap on
      # the whole platform would cut a real download.
      UPSTREAM_TIMEOUT: ${GATEWAY_UPSTREAM_TIMEOUT:-30s}
      # The gateway rejects a malformed token so a service never pays for one; it does
      # not decide who may do what. Same secret, issuer and audience as everything
      # else, stated explicitly for the same reason notification states them.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-arcadia-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-arcadia}
    # No `depends_on`. The gateway starts, reports itself live, and answers 503 naming
    # whichever service is not up yet — which is more useful during a cold start than
    # a container that refuses to boot. Its /readyz probes all seven, all
    # non-critical: reporting the gateway unready because one of seven is down would
    # take the whole platform offline over a single failure.
    deploy:
      resources:
        limits:
          # It holds no data and copies bytes between sockets. The only thing that
          # grows is the rate limiter's map of client addresses, which is swept.
          memory: 96M

  frontend:
    # Built by `cd arcadia-frontend && make docker API_MODE=... API_URL=...`, which
    # `infra`'s own `make images` now does with `API_MODE=live` against the gateway's
    # published address. The image bakes its API mode: `NEXT_PUBLIC_*` is inlined into
    # the client bundle at build time, so this cannot be repointed by changing an
    # environment variable on a running container — the build argument is where that
    # decision lives.
    #
    # Rebuild with `make -C ../arcadia-frontend docker` (no args) to get the old
    # `mock` image back — the storefront is still fully demonstrable with only this
    # one container running, no backend required.
    image: arcadia/frontend:${FRONTEND_VERSION:-local}
    container_name: arcadia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    # No `depends_on`. Against the mock it needs nothing, and against a gateway it
    # should still start and render rather than wait — a storefront that will not
    # boot because a backend is down is worse than one that shows an error.
    deploy:
      resources:
        limits:
          # A Node server rendering React. Higher than the Go services and lower
          # than the JVM-free Python ones need for their Kafka consumers.
          memory: 320M

  # --- Metrics (profile: metrics) -----------------------------------------
  #
  # Prometheus scrapes each service's /metrics directly. There is no OTel collector,
  # no Loki and no Tempo: log correlation works through the correlation id the
  # services already stamp on every line, which answers "show me everything for this
  # purchase" without three more containers to run.

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: arcadia-prometheus
    profiles: [metrics]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.4.0
    container_name: arcadia-grafana
    profiles: [metrics]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Skips the login screen for a local stack. Never do this anywhere reachable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus]
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  kafka-data:
  # Still here, and still used when STORAGE_BACKEND=filesystem. Keeping it means switching the
  # backend back is one variable rather than a lost store.
  media-data:
  minio-data:
