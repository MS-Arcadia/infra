# Loki for the local stack. Single-binary, filesystem-backed: enough to follow a
# correlation id across services, and nothing more.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Services emit structured JSON with a trace_id, so the ingestion path must accept
  # OTLP as well as Loki's native push API.
  allow_structured_metadata: true
  # A local stack has no retention pressure worth managing; a week is plenty and keeps
  # the volume small.
  retention_period: 168h
  # Generous for development: a burst of debug logging should not be dropped silently.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
