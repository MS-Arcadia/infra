apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Follow a request from a log line into the metrics for the service that
      # wrote it. The correlation id is not a Loki label — it is a field inside
      # the JSON line — so this matches it out of the parsed body rather than
      # from the stream's labels.
      derivedFields:
        - name: correlation_id
          # One spelling platform-wide now. This used to match either, because
          # community and recommendation emitted correlationId while the other
          # twelve services emitted correlation_id.
          matcherRegex: '"correlation_id":\s*"([^"]+)"'
          url: '/explore?left={"datasource":"loki","queries":[{"expr":"{namespace=\"arcadia\"} |= \"$${__value.raw}\""}]}'
          datasourceUid: loki
