# Alert rules.
#
# These are the SLO table from the architecture document turned into executable rules.
# The severity split is deliberate and it is the whole point of the file: `page` means a
# human is woken up, `ticket` means it waits for business hours. Anything that can cost a
# user money, or that means the ledger no longer adds up, pages. Nothing else does — an
# alert set where everything is urgent trains people to ignore all of it.

groups:
  # -------------------------------------------------------------------------
  # Financial integrity. Every rule here pages.
  # -------------------------------------------------------------------------
  - name: arcadia-financial-integrity
    interval: 30s
    rules:
      - alert: LedgerMismatch
        # The reconciliation job compares each wallet's stored balance against the sum of
        # its ledger. Anything but zero means the two disagree, which means either a bug
        # wrote a balance without an entry or somebody edited the database by hand.
        expr: arcadia_ledger_mismatch_count > 0
        for: 0m
        labels:
          severity: page
          team: payments
        annotations:
          summary: "Ledger mismatch detected ({{ $value }} wallets)"
          description: >-
            One or more wallet balances no longer equal the sum of their ledger entries.
            The ledger is the source of truth. Do not "fix" a balance by hand: find the
            movement that was recorded without an entry, or the entry recorded without a
            movement, and correct it with an ADJUSTMENT so the history stays auditable.
          runbook: docs/runbooks/ledger-mismatch.md

      - alert: OutboxMessagesPermanentlyFailed
        # A FAILED outbox row has exhausted its retries. The state change happened but
        # nothing was told about it, so a saga is stalled or a wallet was never credited.
        expr: arcadia_outbox_backlog{status="failed"} > 0
        for: 1m
        labels:
          severity: page
          team: payments
        annotations:
          summary: "{{ $value }} outbox messages have permanently failed on {{ $labels.service }}"
          description: >-
            These events were committed with their state change but could not be
            published. Something downstream believes the world is in an older state than
            it is. Inspect outbox_messages WHERE status = 'FAILED' and last_error.

      - alert: EventsDeadLettered
        # The SLO target for DLQ depth is zero. A dead-lettered financial event means a
        # command the platform could not carry out.
        expr: increase(arcadia_events_dead_lettered_total[10m]) > 0
        for: 0m
        labels:
          severity: page
          team: payments
        annotations:
          summary: "Events dead-lettered on {{ $labels.topic }}"
          description: >-
            {{ $value }} messages went to the dead-letter topic in the last ten minutes.
            Each one is a business operation that did not happen.

      - alert: OutboxDispatcherStalled
        # The dispatcher should drain within a poll interval or two. A pending row that is
        # minutes old means it is stuck, not busy.
        expr: arcadia_outbox_oldest_pending_age_seconds > 120
        for: 2m
        labels:
          severity: page
          team: payments
        annotations:
          summary: "The outbox dispatcher on {{ $labels.service }} is not draining"
          description: >-
            The oldest unpublished event is {{ $value | humanizeDuration }} old. Either
            the broker is unreachable or the dispatcher goroutine has died. Events are
            durable, so nothing is lost yet — but every consumer is now behind.

      - alert: PaymentCallbackSignatureFailures
        # A trickle is normal noise. A sustained stream of invalid signatures is somebody
        # probing the callback endpoint.
        expr: increase(arcadia_payment_callbacks_rejected_total{reason=~"parse_or_signature|CALLBACK_BAD_SIGNATURE"}[5m]) > 20
        for: 5m
        labels:
          severity: page
          team: security
        annotations:
          summary: "Sustained invalid payment callback signatures"
          description: >-
            {{ $value }} callbacks failed signature verification in five minutes. The
            endpoint is unauthenticated by necessity; this looks like someone testing it.

      - alert: PaymentAmountMismatch
        # A settlement whose amount disagrees with the intent was refused. Either the
        # provider integration is wrong or a callback is being forged.
        expr: increase(arcadia_payment_callbacks_rejected_total{reason="PAYMENT_AMOUNT_MISMATCH"}[15m]) > 0
        for: 0m
        labels:
          severity: page
          team: payments
        annotations:
          summary: "A payment settlement reported an amount that did not match its intent"
          description: >-
            This was refused, so no wallet was credited. Confirm whether the gateway's
            currency unit changed (check GATEWAY_CURRENCY_DIVISOR) before assuming an attack.

  # -------------------------------------------------------------------------
  # Service health.
  # -------------------------------------------------------------------------
  - name: arcadia-service-health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"wallet-service|payment-service"} == 0
        for: 1m
        labels:
          severity: page
          team: payments
        annotations:
          summary: "{{ $labels.job }} is not responding to scrapes"

      - alert: HighErrorRate
        # The SLO is an error rate under 0.1%; this fires at 1%, which is the "something
        # is actually wrong" threshold rather than the objective itself.
        expr: |
          sum by (service) (rate(arcadia_rpc_requests_total{code!~"OK|2..|3.."}[5m]))
            /
          sum by (service) (rate(arcadia_rpc_requests_total[5m]))
            > 0.01
        for: 5m
        labels:
          severity: page
          team: payments
        annotations:
          summary: "{{ $labels.service }} is failing {{ $value | humanizePercentage }} of requests"

      - alert: ReadLatencyBudgetExceeded
        # The objective is a p95 under 300ms; the alert fires at 500ms sustained, so that
        # ordinary variance does not page anybody.
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(arcadia_rpc_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: ticket
          team: payments
        annotations:
          summary: "{{ $labels.service }} p95 latency is {{ $value | humanizeDuration }}"
          description: The objective is 300ms; this has been over 500ms for five minutes.

      - alert: KafkaConsumerLagGrowing
        expr: arcadia_kafka_consumer_lag > 1000
        for: 5m
        labels:
          severity: ticket
          team: payments
        annotations:
          summary: "Consumer lag on {{ $labels.topic }} is {{ $value }} messages"
          description: >-
            The SLO threshold is 1000. Check whether a handler is slow or a partition is
            stuck behind a message that keeps being retried.

      - alert: GatewayLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (gateway, le) (rate(arcadia_payment_gateway_duration_seconds_bucket[5m]))
          ) > 10
        for: 10m
        labels:
          severity: ticket
          team: payments
        annotations:
          summary: "The {{ $labels.gateway }} gateway is slow (p95 {{ $value | humanizeDuration }})"
          description: >-
            Top-ups will be timing out for users. This is an external dependency, so the
            action is usually to contact the provider rather than to deploy anything.

  # -------------------------------------------------------------------------
  # Abuse signals. These are tickets: a human decides, per the requirements.
  # -------------------------------------------------------------------------
  - name: arcadia-abuse
    interval: 1m
    rules:
      - alert: GiftCardProbing
        expr: increase(arcadia_rate_limit_blocks_total{limiter="giftcard-attempt"}[10m]) > 50
        for: 5m
        labels:
          severity: ticket
          team: support
        annotations:
          summary: "Elevated gift card guessing across the platform"
          description: >-
            {{ $value }} redemption attempts were throttled in ten minutes. Individual
            users are already flagged for Support review through
            GiftCardAbuseDetected; this rule catches a distributed attempt that no single
            account's counters would reveal.

      - alert: ManualAdjustmentsUnusual
        # A manual balance adjustment is legitimate but rare. A burst of them is either an
        # incident being cleaned up or a compromised admin account.
        expr: increase(arcadia_wallet_operations_total{operation="adjust",outcome="success"}[1h]) > 10
        for: 0m
        labels:
          severity: ticket
          team: security
        annotations:
          summary: "{{ $value }} manual balance adjustments in the last hour"
          description: Confirm these were expected. Every one names the operator who made it.
