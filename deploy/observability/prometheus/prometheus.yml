# Prometheus for the local stack.
#
# Two ingestion paths on purpose: the collector pushes OTLP metrics in through
# remote-write, and Prometheus also scrapes each service's /metrics endpoint directly so
# that the Go runtime and process collectors are captured.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: arcadia-local
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: wallet-service
    metrics_path: /metrics
    static_configs:
      - targets: ['wallet-service:8080']
        labels:
          service: wallet-service

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ['payment-service:8081']
        labels:
          service: payment-service

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
