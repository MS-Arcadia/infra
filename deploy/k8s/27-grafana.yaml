# Provisioning (datasource + dashboards) is loaded into ConfigMaps by the apply
# script from infra/deploy/observability/grafana/ — the same files the compose
# stack's Grafana uses, so a dashboard edited once shows up in both.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: arcadia
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: arcadia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      # Grafana's container ships a numeric-uid image; the mounted PVC needs to
      # be writable by that uid rather than root, which is what local-path's
      # default hands a fresh volume.
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: docker.arvancloud.ir/grafana/grafana:11.4.0
          ports: [{containerPort: 3000}]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: GRAFANA_ADMIN_USER}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: GRAFANA_ADMIN_PASSWORD}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            # Unlike the compose stack's Grafana, this one is reachable from the
            # open internet — no anonymous admin access here.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_SERVER_ROOT_URL, value: "http://grafana.arcadia.neda-event.ir"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards-json, mountPath: /var/lib/grafana/dashboards}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits: {memory: 256Mi, cpu: 150m}
            requests: {memory: 128Mi, cpu: 50m}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboards-provider
          configMap: {name: grafana-dashboards-provider}
        - name: dashboards-json
          configMap: {name: grafana-dashboards-json}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: arcadia
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
