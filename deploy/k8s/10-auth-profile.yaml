apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-profile-service
  namespace: arcadia
spec:
  replicas: 1
  selector:
    matchLabels: {app: auth-profile-service}
  template:
    metadata:
      labels: {app: auth-profile-service}
    spec:
      containers:
        - name: auth-profile-service
          image: ghcr.io/ms-arcadia/auth-profile-service:latest
          ports: [{containerPort: 8085}]
          env:
            - {name: ENV, value: local}
            - {name: LOG_LEVEL, value: INFO}
            - {name: DATABASE_URL, value: "postgresql+asyncpg://auth_user:auth_pass@postgres:5432/arcadia_auth"}
            - {name: REDIS_URL, value: "redis://redis:6379/1"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: KAFKA_TOPIC_PRESENCE_EVENTS, value: "presence-events"}
            - {name: JWT_ISSUER, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_ISSUER}}}
            - {name: JWT_AUDIENCE, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_AUDIENCE}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_SECRET}}}
            - {name: SUPER_ADMIN_EMAIL, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: SUPER_ADMIN_EMAIL}}}
            - {name: SUPER_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: SUPER_ADMIN_PASSWORD}}}
            - {name: RATE_LIMIT_REGISTER, value: "200/minute"}
            - {name: RATE_LIMIT_LOGIN, value: "200/minute"}
          # Both probes get 5s rather than the default 1s. This service hashes passwords with
          # bcrypt on the event loop thread, so while a login is being hashed nothing else —
          # including /livez — is answered. At the old 150m limit that regularly took longer
          # than a second, the liveness probe failed three times and the kubelet killed a pod
          # that was doing exactly what it was asked to do.
          readinessProbe:
            httpGet: {path: /readyz, port: 8085}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: 8085}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          # bcrypt is deliberately expensive, and this is the only service that runs it. A
          # 150m limit is under a fifth of a core, which turned every sign-in into seconds of
          # throttled CPU: a handful of logins in a row was enough to take auth down. The
          # request stays small because the cost is bursty — a limit is a ceiling for a spike,
          # not a reservation — so idle cost is unchanged and the node is not over-committed.
          resources:
            limits: {memory: 256Mi, cpu: "1"}
            requests: {memory: 128Mi, cpu: 100m}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-profile-service
  namespace: arcadia
  annotations:
    # Picked up by Prometheus' endpoint discovery — see
    # infra/deploy/k8s/observability/prometheus.yml. Opt-in, so a Service with no
    # /metrics never becomes a permanently red target.
    arcadia.dev/scrape: "true"
spec:
  selector: {app: auth-profile-service}
  ports: [{port: 8085, targetPort: 8085}]
