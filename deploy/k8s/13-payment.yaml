apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: arcadia
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-service}
  template:
    metadata:
      labels: {app: payment-service}
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/ms-arcadia/payment-service:latest
          ports: [{containerPort: 8081}, {containerPort: 9091}]
          env:
            - {name: ENVIRONMENT, value: local}
            - {name: LOG_LEVEL, value: info}
            - {name: DATABASE_URL, value: "postgres://payment_user:payment_pass@postgres:5432/arcadia_payment?sslmode=disable"}
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_SECRET}}}
            - {name: GATEWAY_KIND, value: mock}
            - {name: GATEWAY_CALLBACK_SECRET, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: GATEWAY_CALLBACK_SECRET}}}
            - {name: PAYMENT_CURRENCY, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: WALLET_CURRENCY}}}
            # Both the sandbox bank page and the callback links printed on it are followed by
            # a browser, so this has to be the ingress hostname — the service's own config
            # says so. Through the gateway, which strips /payment before forwarding.
            - {name: PUBLIC_BASE_URL, value: "https://api.arcadia.aptcodegen.online/payment"}
            # Where the bank sends the payer back. Without it a top-up ends on localhost:3000.
            - {name: DEFAULT_RETURN_URL, value: "https://arcadia.aptcodegen.online/wallet"}
            - {name: JOB_SWEEP_INTERVAL, value: 1m}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            limits: {memory: 128Mi, cpu: 150m}
            requests: {memory: 64Mi, cpu: 50m}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: arcadia
  annotations:
    # Picked up by Prometheus' endpoint discovery — see
    # infra/deploy/k8s/observability/prometheus.yml. Opt-in, so a Service with no
    # /metrics never becomes a permanently red target.
    arcadia.dev/scrape: "true"
spec:
  selector: {app: payment-service}
  ports:
    - {name: http, port: 8081, targetPort: 8081}
    - {name: grpc, port: 9091, targetPort: 9091}
