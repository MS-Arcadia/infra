# MinIO for media-service's object storage, as a StatefulSet: an object store's
# drive is its identity, and a replacement pod must reattach to the same one
# rather than come up empty and quietly serve 404s for every uploaded build.
#
# Plus a one-shot Job (minio-setup)
# that creates the bucket and a scoped service account so media-service never
# holds the root credentials. Same script infra/deploy/compose/minio-setup.sh
# uses, loaded into a ConfigMap by the apply script.
apiVersion: v1
kind: Service
metadata:
  # Headless, for the stable per-pod DNS a StatefulSet needs. The ClusterIP
  # Service below is the S3 endpoint media-service is configured with.
  name: minio-headless
  namespace: arcadia
spec:
  clusterIP: None
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: arcadia
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: docker.arvancloud.ir/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data, --console-address, ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MINIO_ROOT_PASSWORD}}
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "http://localhost:9001"
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          resources:
            limits: {memory: 512Mi, cpu: 200m}
            requests: {memory: 256Mi, cpu: 100m}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: arcadia
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: arcadia
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-setup
          image: docker.arvancloud.ir/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: [/bin/sh, /setup.sh]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MINIO_ROOT_PASSWORD}}
            - name: MEDIA_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MEDIA_S3_ACCESS_KEY}}
            - name: MEDIA_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MEDIA_S3_SECRET_KEY}}
            - name: MEDIA_S3_BUCKET
              valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MEDIA_S3_BUCKET}}
          volumeMounts:
            - {name: script, mountPath: /setup.sh, subPath: minio-setup.sh}
          resources:
            limits: {memory: 192Mi, cpu: 150m}
            requests: {memory: 96Mi, cpu: 50m}
      volumes:
        - name: script
          configMap: {name: minio-setup-script, defaultMode: 0755}
