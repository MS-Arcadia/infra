apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: arcadia
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      containers:
        - name: order-service
          image: ghcr.io/ms-arcadia/order-service:latest
          ports: [{containerPort: 8083}]
          env:
            - {name: ENVIRONMENT, value: local}
            - {name: LOG_LEVEL, value: info}
            - {name: DATABASE_URL, value: "postgresql://order_user:order_pass@postgres:5432/arcadia_order"}
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_SECRET}}}
            - {name: PLATFORM_USER_ID, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: PLATFORM_USER_ID}}}
            - {name: CATALOG_BASE_URL, value: "http://catalog-service:8082"}
            - {name: WALLET_BASE_URL, value: "http://wallet-service:8080"}
            - {name: SAGA_SWEEP_INTERVAL_SECONDS, value: "30"}
          readinessProbe:
            httpGet: {path: /readyz, port: 8083}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: 8083}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            limits: {memory: 160Mi, cpu: 150m}
            requests: {memory: 96Mi, cpu: 50m}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: arcadia
  annotations:
    # Picked up by Prometheus' endpoint discovery — see
    # infra/deploy/k8s/observability/prometheus.yml. Opt-in, so a Service with no
    # /metrics never becomes a permanently red target.
    arcadia.dev/scrape: "true"
spec:
  selector: {app: order-service}
  ports: [{port: 8083, targetPort: 8083}]
