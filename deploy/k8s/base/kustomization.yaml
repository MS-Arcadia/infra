apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is deliberately environment-agnostic: no namespace, no image tags, no
# replica counts that a staging cluster would want different. Overlays supply those.
#
# Namespaces are not here on purpose — see namespaces/kustomization.yaml.
resources:
  - wallet-service
  - payment-service

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: arcadia
      app.kubernetes.io/managed-by: kustomize
