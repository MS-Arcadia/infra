# Placeholder Secret.
#
# Committed with obviously fake values so the manifests apply on a fresh cluster. Real
# values come from Vault or a sealed-secrets controller — never from this file. The
# architecture document is explicit that secrets live in Kubernetes Secrets or Vault and
# never in source, and a plausible-looking placeholder is how that rule gets broken by
# accident.
apiVersion: v1
kind: Secret
metadata:
  name: wallet-service-secrets
  annotations:
    arcadia.io/managed-by: "REPLACE-WITH-VAULT-OR-SEALED-SECRETS"
type: Opaque
stringData:
  DATABASE_URL: "postgres://wallet_user:REPLACE_ME@postgres-wallet.arcadia-data.svc.cluster.local:5432/arcadia_wallet?sslmode=require"
  JWT_SECRET: "REPLACE_ME_WITH_A_32_BYTE_MINIMUM_SECRET"
  # Rotating this makes every unredeemed gift card unredeemable, because the stored
  # hashes can no longer be reproduced. Treat it as permanent state, not as a rotatable
  # credential.
  GIFT_CARD_PEPPER: "REPLACE_ME_WITH_A_32_BYTE_MINIMUM_PEPPER"
  # Identifies this service when it calls the Payment Adapter.
  SERVICE_TOKEN: "REPLACE_ME"
