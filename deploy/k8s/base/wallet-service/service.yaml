apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  labels:
    app.kubernetes.io/name: wallet-service
    app.kubernetes.io/part-of: arcadia
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wallet-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
# A headless Service so that gRPC clients using round_robin can resolve every pod
# address. Without it, a client opens one connection to the ClusterIP and every request
# from that client lands on the same pod, defeating the point of running replicas.
apiVersion: v1
kind: Service
metadata:
  name: wallet-service-headless
  labels:
    app.kubernetes.io/name: wallet-service
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wallet-service
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wallet-service
  labels:
    app.kubernetes.io/name: wallet-service
# The service talks to Postgres, Redis and Kafka, never to the Kubernetes API. Mounting
# a token it cannot use would only be something for an attacker to steal.
automountServiceAccountToken: false
