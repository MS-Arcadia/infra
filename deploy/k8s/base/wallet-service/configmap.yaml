apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-service-config
data:
  SERVICE_NAME: wallet-service
  LOG_LEVEL: info
  LOG_FORMAT: json

  # gRPC only in a cluster: other services call this one, and the front end goes through
  # the API gateway. The HTTP listener still starts for probes and metrics.
  SERVER_MODE: grpc
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  # Reflection is a development convenience; in a cluster it only advertises the API
  # surface to anything that can reach the port.
  GRPC_REFLECTION: "false"

  REDIS_ENABLED: "true"
  REDIS_ADDR: redis.arcadia-data.svc.cluster.local:6379

  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka.arcadia-data.svc.cluster.local:9092
  KAFKA_GROUP_ID: wallet-service
  # Topics are created by the platform, not by an application pod that may lack the
  # privilege — and certainly not by fourteen pods racing to create them.
  KAFKA_ENSURE_TOPICS: "false"

  PAYMENT_SERVICE_GRPC: payment-service.arcadia-app.svc.cluster.local:9091

  WALLET_CURRENCY: IRR
  INTEREST_ENABLED: "true"
  INTEREST_ANNUAL_RATE_BPS: "500"
  INTEREST_MIN_BALANCE_MINOR: "100000"

  GIFTCARD_ABUSE_PER_MINUTE: "5"
  GIFTCARD_ABUSE_PER_HOUR: "30"
  GIFTCARD_ABUSE_FLAG_AT: "10"

  JOB_RECONCILE_INTERVAL: 15m
  JOB_INTEREST_INTERVAL: 24h
  JOB_HOLD_SWEEP_INTERVAL: 5m

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  # 100% sampling on the financial path. These traces are how a disputed transaction is
  # reconstructed; the volume is low enough that sampling would cost more than it saves.
  OTEL_TRACE_SAMPLE_PERCENT: "100"
