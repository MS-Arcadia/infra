apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wallet-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wallet-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 70% rather than the usual 80%: this service spends time waiting on database
          # row locks, so useful work is not purely CPU-bound and headroom matters more.
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React quickly to a festival-sale spike.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Scale down slowly. Each pod runs Kafka consumers, and every removal triggers a
      # consumer-group rebalance that briefly stops processing; flapping replicas would
      # mean near-constant rebalancing.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wallet-service
spec:
  # At least one pod must survive any voluntary disruption — a node drain, a cluster
  # upgrade. Without this, draining a node could take the whole service down.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-service
