apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - configmap.yaml
  - secret.yaml
  - networkpolicy.yaml

labels:
  # includeSelectors is false because the selectors are already written explicitly in the
  # Deployment and Service. Letting kustomize inject them would make a future label change
  # silently rewrite an existing Deployment's immutable selector.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: wallet-service
      app.kubernetes.io/part-of: arcadia
