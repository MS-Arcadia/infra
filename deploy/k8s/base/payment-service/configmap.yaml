apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
data:
  SERVICE_NAME: payment-service
  LOG_LEVEL: info
  LOG_FORMAT: json

  # No SERVER_MODE here: this service always serves HTTP, because a bank callback
  # arrives as an HTTP request from outside the cluster and no configuration can make
  # that not so.
  HTTP_ADDR: ":8081"
  GRPC_ADDR: ":9091"
  # Reflection is a development convenience; in a cluster it only advertises the API
  # surface to anything that can reach the port.
  GRPC_REFLECTION: "false"

  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka.arcadia-data.svc.cluster.local:9092
  # Topics are created by the platform, not by an application pod that may lack the
  # privilege — and certainly not by fourteen pods racing to create them.
  KAFKA_ENSURE_TOPICS: "false"

  KAFKA_TOPIC_PAYMENT_EVENTS: payment-events

  PAYMENT_CURRENCY: IRR
  PAYMENT_MIN_AMOUNT_MINOR: "1000"
  # A ceiling that bounds the damage from a bug or an attack inflating an amount, rather
  # than a business rule about how much anyone may top up.
  PAYMENT_MAX_AMOUNT_MINOR: "500000000"
  PAYMENT_INTENT_TTL: 30m

  # A real provider. GATEWAY_KIND=mock is refused outright when ENVIRONMENT=production,
  # because running the sandbox there would mean accepting fake payments as real money.
  GATEWAY_KIND: http
  GATEWAY_NAME: bank
  # Not a secret: knowing the provider's API host reveals nothing an attacker could use.
  # The credentials that go with it are in the Secret.
  GATEWAY_BASE_URL: https://api.bank.example
  # A gateway quoting Toman against a Rial ledger needs 10 here. Getting this wrong by a
  # factor of ten is a classic integration bug, so it is explicit.
  GATEWAY_CURRENCY_DIVISOR: "1"
  GATEWAY_TIMEOUT: 15s

  # Must be reachable from the bank's network, so this is the ingress hostname and not a
  # cluster-internal name.
  PUBLIC_BASE_URL: https://api.arcadia.example
  DEFAULT_RETURN_URL: https://arcadia.example/wallet

  # The reconciliation sweeper. This is what recovers a payment whose callback was lost,
  # so the interval is short.
  JOB_SWEEP_INTERVAL: 2m
  JOB_SWEEP_BATCH_SIZE: "50"

  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  # 100% sampling on the financial path. These traces are how a disputed transaction is
  # reconstructed; the volume is low enough that sampling would cost more than it saves.
  OTEL_TRACE_SAMPLE_PERCENT: "100"
