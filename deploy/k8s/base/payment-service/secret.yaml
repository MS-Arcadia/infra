# Placeholder Secret.
#
# Committed with obviously fake values so the manifests apply on a fresh cluster. Real
# values come from Vault or a sealed-secrets controller — never from this file. The
# architecture document is explicit that secrets live in Kubernetes Secrets or Vault and
# never in source, and a plausible-looking placeholder is how that rule gets broken by
# accident.
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  annotations:
    arcadia.io/managed-by: "REPLACE-WITH-VAULT-OR-SEALED-SECRETS"
type: Opaque
stringData:
  DATABASE_URL: "postgres://payment_user:REPLACE_ME@postgres-payment.arcadia-data.svc.cluster.local:5432/arcadia_payment?sslmode=require"
  JWT_SECRET: "REPLACE_ME_WITH_A_32_BYTE_MINIMUM_SECRET"
  # Provider credentials. These are the highest-value secrets in the platform: they
  # authorise taking money from real cards. The gateway's base URL is not among them —
  # it is not a credential, so it lives in the ConfigMap.
  GATEWAY_MERCHANT_ID: "REPLACE_ME"
  GATEWAY_API_KEY: "REPLACE_ME"
  # Verifies the signature on provider callbacks — the service's only unauthenticated
  # write path.
  GATEWAY_CALLBACK_SECRET: "REPLACE_ME"
