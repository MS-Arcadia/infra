apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: arcadia
spec:
  replicas: 1
  selector:
    matchLabels: {app: review-service}
  template:
    metadata:
      labels: {app: review-service}
    spec:
      containers:
        - name: review-service
          image: ghcr.io/ms-arcadia/review-service:latest
          ports: [{containerPort: 8088}]
          env:
            - {name: ENVIRONMENT, value: local}
            - {name: LOG_LEVEL, value: info}
            - {name: HTTP_PORT, value: "8088"}
            - {name: DATABASE_URL, value: "postgresql+asyncpg://review_user:review_pass@postgres:5432/arcadia_review"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_SECRET}}}
            - {name: JWT_ISSUER, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_ISSUER}}}
            - {name: JWT_AUDIENCE, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_AUDIENCE}}}
            - {name: CATALOG_SERVICE_URL, value: "http://catalog-service:8082"}
          readinessProbe:
            httpGet: {path: /readyz, port: 8088}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: 8088}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            limits: {memory: 160Mi}
            requests: {memory: 96Mi, cpu: 50m}
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: arcadia
spec:
  selector: {app: review-service}
  ports: [{port: 8088, targetPort: 8088}]
