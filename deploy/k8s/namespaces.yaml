# Namespaces, matching the deployment diagram in the architecture document. The split is
# load-bearing: NetworkPolicies select on namespace labels.
apiVersion: v1
kind: Namespace
metadata:
  name: arcadia-app
  labels: { kubernetes.io/metadata.name: arcadia-app }
---
apiVersion: v1
kind: Namespace
metadata:
  name: arcadia-data
  labels: { kubernetes.io/metadata.name: arcadia-data }
