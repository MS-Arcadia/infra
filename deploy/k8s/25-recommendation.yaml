apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: arcadia
spec:
  replicas: 1
  selector:
    matchLabels: {app: recommendation-service}
  template:
    metadata:
      labels: {app: recommendation-service}
    spec:
      containers:
        - name: recommendation-service
          image: ghcr.io/ms-arcadia/recommendation-service:latest
          ports: [{containerPort: 8093}]
          env:
            - {name: APP_ENV, value: local}
            - {name: LOG_LEVEL, value: INFO}
            - {name: PERSISTENCE_BACKEND, value: postgres}
            - {name: MESSAGING_BACKEND, value: kafka}
            - {name: IDENTITY_BACKEND, value: jwt}
            - {name: CACHE_BACKEND, value: redis}
            - {name: REDIS_URL, value: "redis://redis:6379/6"}
            - {name: DATABASE_URL, value: "postgresql+asyncpg://recommendation_user:recommendation_pass@postgres:5432/arcadia_recommendation"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_SECRET}}}
            - {name: JWT_ISSUER, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_ISSUER}}}
            - {name: JWT_AUDIENCE, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: JWT_AUDIENCE}}}
            - {name: GENERATION_ENABLED, value: "true"}
            - {name: GENERATION_INTERVAL_SECONDS, value: "300"}
            # Which space the content half ranks in — `sparse` is genre/tag cosine and needs nothing
            # behind it, `dense` is semantic and needs a real embedding endpoint. Both vectors are
            # ingested either way, so flipping this is a rollout, not a migration.
            - {name: SCORING_BACKEND, value: dense}
            # `hashing` is the in-process fallback; `huggingface` needs EMBEDDING_ENDPOINT alongside it or
            # the pod refuses to start. The keys are optional so the deployment still comes up against a
            # secret created before they existed.
            - {name: EMBEDDING_BACKEND, value: huggingface}
            - {name: EMBEDDING_ENDPOINT, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: EMBEDDING_ENDPOINT, optional: true}}}
            - {name: EMBEDDING_API_KEY, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: EMBEDDING_API_KEY, optional: true}}}
            # Baked into the `vector(n)` column: changing it needs a migration and a re-embedding.
            - {name: EMBEDDING_DIMENSIONS, value: "1024"}
            - {name: EMBEDDING_PREFIX, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: EMBEDDING_PREFIX, optional: true}}}
            # Writes the `reasons` on each suggestion, one call per user per sweep and never on the read
            # path. `none` leaves the field empty rather than failing a list.
            - {name: EXPLANATION_BACKEND, value: openai}
            - {name: EXPLANATION_BASE_URL, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: EXPLANATION_BASE_URL, optional: true}}}
            - {name: EXPLANATION_API_KEY, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: EXPLANATION_API_KEY, optional: true}}}
            # Paired with https://api.llm7.io/v1 in the secret; it honours response_format: json_object,
            # which is how the reasons come back parseable.
            - {name: EXPLANATION_MODEL, value: gemini-3.1-flash-lite}
          # Startup is slower than the other services': migrations, four Kafka consumer
          # groups joining, and — with the dense backend on — the embedding client being
          # made ready before the port opens. A fixed initialDelay for that was killed by
          # its own liveness probe four times before it settled, each restart paying the
          # whole cost again. A startupProbe gives it up to two minutes to answer once,
          # and only then do the steady-state probes begin.
          startupProbe:
            httpGet: {path: /livez, port: 8093}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: 8093}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /livez, port: 8093}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            # Room for a 1024-dimension vector per game and the batch of 32 being embedded.
            # The sparse backend fitted in 160Mi; the dense one sat at 98Mi idle, which is
            # too close to it to survive a sweep.
            limits: {memory: 384Mi, cpu: 400m}
            requests: {memory: 128Mi, cpu: 50m}
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: arcadia
  annotations:
    # Picked up by Prometheus' endpoint discovery — see
    # infra/deploy/k8s/observability/prometheus.yml. Opt-in, so a Service with no
    # /metrics never becomes a permanently red target.
    arcadia.dev/scrape: "true"
spec:
  selector: {app: recommendation-service}
  ports: [{port: 8093, targetPort: 8093}]
