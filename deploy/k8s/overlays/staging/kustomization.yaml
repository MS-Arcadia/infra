apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arcadia-app

resources:
  - ../../base

# Staging tracks main. Pinning by digest would be better practice for production; here
# the point is to always run the latest merged code.
images:
  - name: ghcr.io/ms-arcadia/wallet-service
    newTag: main
  - name: ghcr.io/ms-arcadia/payment-service
    newTag: main

replicas:
  - name: wallet-service
    count: 1
  - name: payment-service
    count: 1

patches:
  # Staging talks to the provider's sandbox rather than to a real bank, and logs at debug
  # so a failed flow can actually be diagnosed.
  - target:
      kind: ConfigMap
      name: payment-service-config
    patch: |-
      - op: replace
        path: /data/GATEWAY_KIND
        value: mock
      - op: replace
        path: /data/PUBLIC_BASE_URL
        value: https://staging-api.arcadia.example
      - op: replace
        path: /data/DEFAULT_RETURN_URL
        value: https://staging.arcadia.example/wallet
  - target:
      kind: ConfigMap
      name: wallet-service-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      # Both transports in staging, so the Postman collection works against it.
      - op: replace
        path: /data/SERVER_MODE
        value: both
      - op: replace
        path: /data/GRPC_REFLECTION
        value: "true"
  - target:
      kind: ConfigMap
      name: payment-service-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug

labels:
  - pairs:
      arcadia.io/environment: staging
