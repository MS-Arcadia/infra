apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arcadia-app

resources:
  - ../../base

# Production runs a tagged release, never a moving tag. Deploying `latest` means nobody
# can say afterwards which code was running during an incident.
images:
  - name: ghcr.io/ms-arcadia/wallet-service
    newTag: v1.0.0
  - name: ghcr.io/ms-arcadia/payment-service
    newTag: v1.0.0

replicas:
  - name: wallet-service
    count: 3
  - name: payment-service
    count: 2

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: wallet-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  # Production gets real resource headroom.
  - target:
      kind: Deployment
      name: wallet-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  # At least two must survive a node drain, not just one.
  - target:
      kind: PodDisruptionBudget
      name: wallet-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2

labels:
  - pairs:
      arcadia.io/environment: production
