# Built with NEXT_PUBLIC_API_MODE=live baked in at image build time (repo
# variables on ms-arcadia/arcadia-frontend), pointed at the gateway's public
# ingress host — see infra/deploy/k8s/24-ingress.yaml. Repointing this means
# rebuilding the image, not editing env here: Next.js inlines NEXT_PUBLIC_*
# into the client bundle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: arcadia
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ms-arcadia/arcadia-frontend:latest
          ports: [{containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits: {memory: 320Mi, cpu: 200m}
            requests: {memory: 160Mi, cpu: 50m}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: arcadia
spec:
  selector: {app: frontend}
  ports: [{port: 3000, targetPort: 3000}]
