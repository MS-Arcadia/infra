# Wallet service on Kubernetes.
#
# One file rather than a kustomize base with overlays. With two services and one
# environment, overlays add indirection without answering a question anybody is asking;
# when a second environment appears, `kubectl kustomize` can be layered on top of these
# files unchanged.
#
#   kubectl apply -f namespaces.yaml
#   kubectl apply -f wallet-service.yaml
#
# Replace every REPLACE_ME in the Secret first. It is committed with obvious placeholders
# so the manifest applies on a fresh cluster — a plausible-looking default is how a real
# credential ends up in git.

apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-service-config
  namespace: arcadia-app
data:
  LOG_LEVEL: info
  # gRPC only in a cluster: other services call this one, and the front end goes through
  # the gateway. The HTTP listener still starts, for probes and metrics.
  SERVER_MODE: grpc
  GRPC_REFLECTION: "false"
  REDIS_ADDR: redis.arcadia-data.svc.cluster.local:6379
  KAFKA_BROKERS: kafka.arcadia-data.svc.cluster.local:9092
  # Topics are created by the platform, not by pods racing to create them.
  KAFKA_ENSURE_TOPICS: "false"
  PAYMENT_SERVICE_GRPC: payment-service.arcadia-app.svc.cluster.local:9091
  WALLET_CURRENCY: IRR
  INTEREST_ANNUAL_RATE_BPS: "500"
  INTEREST_MIN_BALANCE_MINOR: "100000"
  # The thresholds from the requirements: five wrong codes a minute, thirty an hour,
  # flagged for Support review at ten.
  GIFTCARD_ABUSE_PER_MINUTE: "5"
  GIFTCARD_ABUSE_PER_HOUR: "30"
  GIFTCARD_ABUSE_FLAG_AT: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: wallet-service-secrets
  namespace: arcadia-app
  annotations:
    arcadia.io/source: "REPLACE-WITH-VAULT-OR-SEALED-SECRETS"
type: Opaque
stringData:
  DATABASE_URL: "postgres://wallet_user:REPLACE_ME@postgres-wallet.arcadia-data.svc.cluster.local:5432/arcadia_wallet?sslmode=require"
  JWT_SECRET: "REPLACE_ME_32_BYTES_MINIMUM"
  # Rotating this makes every unredeemed gift card unredeemable, because the stored
  # hashes can no longer be reproduced. Permanent state, not a rotatable credential.
  GIFT_CARD_PEPPER: "REPLACE_ME_32_BYTES_MINIMUM"
  SERVICE_TOKEN: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: arcadia-app
  labels: { app: wallet-service }
spec:
  # Two replicas for availability during a rolling update, not for throughput. The outbox
  # dispatcher and the consumers are all safe to run concurrently.
  replicas: 2
  selector:
    matchLabels: { app: wallet-service }
  strategy:
    rollingUpdate:
      # Never dip below the desired count: a wallet that is briefly absent stalls every
      # purchase saga in flight.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: wallet-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Must exceed the service's own shutdown budget, or Kubernetes SIGKILLs the process
      # mid-transaction.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wallet-service
          image: arcadia/wallet-service:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: wallet-service-config }
            - secretRef: { name: wallet-service-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            # No CPU limit: throttling a service that holds database row locks turns a
            # latency spike into lock contention across the platform. Memory is limited,
            # because a leak should be killed rather than evict its neighbours.
            limits: { memory: 512Mi }
          # Migrations run at boot, so the first readiness check can legitimately take a
          # while. startupProbe gives it room without loosening liveness afterwards.
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            # /livez deliberately checks nothing. A database blip must not get the pod
            # killed: restarting would not fix Postgres and would discard in-flight work.
            httpGet: { path: /livez, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              # The service withdraws readiness on SIGTERM itself; this pause lets the
              # endpoints controller notice before the listeners close.
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: arcadia-app
spec:
  selector: { app: wallet-service }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 9090, targetPort: grpc }
---
apiVersion: v1
kind: Service
metadata:
  # Headless, so gRPC clients using round_robin can resolve every pod. Without it a
  # client opens one connection to the ClusterIP and every request lands on one pod.
  name: wallet-service-headless
  namespace: arcadia-app
spec:
  clusterIP: None
  selector: { app: wallet-service }
  ports:
    - { name: grpc, port: 9090, targetPort: grpc }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wallet-service
  namespace: arcadia-app
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: wallet-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        # 70% rather than 80%: this service waits on database row locks, so useful work
        # is not purely CPU-bound and headroom matters more.
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      # Slowly. Every removal triggers a consumer-group rebalance that briefly stops
      # processing, so flapping replicas would mean near-constant rebalancing.
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wallet-service
  namespace: arcadia-app
spec:
  # One pod must survive a node drain or a cluster upgrade.
  minAvailable: 1
  selector:
    matchLabels: { app: wallet-service }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallet-service
  namespace: arcadia-app
spec:
  # Default-deny with an explicit allow list, so a compromised pod in another service
  # cannot reach the wallet's database or its gRPC port.
  podSelector:
    matchLabels: { app: wallet-service }
  policyTypes: [Ingress, Egress]
  ingress:
    # The gateway and the two services that drive the sagas.
    - from:
        - podSelector: { matchLabels: { app: api-gateway } }
        - podSelector: { matchLabels: { app: store-service } }
        - podSelector: { matchLabels: { app: marketplace-service } }
      ports: [{ protocol: TCP, port: 9090 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    # DNS. Omitting this is the most common NetworkPolicy mistake: everything then fails
    # with a name-resolution error that looks like a broken service.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: arcadia-data } }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 9092 }
    - to:
        - podSelector: { matchLabels: { app: payment-service } }
      ports: [{ protocol: TCP, port: 9091 }]
