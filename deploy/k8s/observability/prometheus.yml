# Prometheus for the cluster deployment.
#
# The compose stack's copy of this file (infra/deploy/observability/prometheus.yml)
# lists one static target per service, which is correct there — compose runs
# exactly one container per service. It is *not* correct here: every service now
# has an HPA and the gateway has a floor of three replicas, and a static target
# pointing at a Service name resolves through the ClusterIP to one arbitrary pod
# per scrape. Counters would appear to jump backwards as the load balancer moved
# between pods with different counts, and `rate()` over that is meaningless.
#
# So targets are discovered per-endpoint instead: one target per pod, each with
# its own series, and `sum by (service)` in the dashboards adds them back up.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  # Every pod backing a Service in this namespace, one target each.
  #
  # Opt-in rather than opt-out: a Service is scraped only if it carries the
  # `arcadia.dev/scrape: "true"` annotation, so adding a Service for something
  # that has no /metrics does not fill the target list with red.
  - job_name: arcadia-services
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [arcadia]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_arcadia_dev_scrape]
        regex: "true"
        action: keep
      # A Service with several ports (wallet and payment each publish HTTP and
      # gRPC) would otherwise be scraped once per port, and the gRPC port does
      # not speak Prometheus — so keep the one named `http`, or the only port on
      # the single-port Services, which is unnamed. Prometheus regexes are RE2
      # and have no backreferences, so matching a port name against an
      # annotation is not available; a naming convention is.
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: (http|)
        action: keep
      # job = the service name, so existing dashboards and alert rules that
      # select on job="catalog-service" keep working unchanged.
      - source_labels: [__meta_kubernetes_service_name]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # Per-pod CPU/memory/network, for the "is the cluster itself okay" half of the
  # overview dashboard — not exposed by any service's own /metrics. Scraped from
  # each node's kubelet, authenticated with this pod's own ServiceAccount token
  # (see 26-prometheus.yaml's RBAC), then filtered to this namespace: cAdvisor
  # reports every pod on the node, including judge's, and this deployment has no
  # business publishing numbers about workloads it doesn't own.
  - job_name: kubernetes-cadvisor
    scheme: https
    # ca_file is the in-cluster CA that actually signs kubernetes.default.svc,
    # so standard verification succeeds — no need to skip it.
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: arcadia
        action: keep
