# One-shot: open the media bucket for anonymous GetObject and set CORS.
#
# Separate from minio-setup because that Job's pod template is immutable once
# it has run, and apply.sh skips the whole file when kubectl refuses it. This
# Job can be deleted and re-applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-public-read
  namespace: arcadia
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: docker.arvancloud.ir/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              mc alias set arcadia http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc ready arcadia
              mc anonymous set download "arcadia/$MEDIA_S3_BUCKET"
              printf '%s\n' '{"CORSRules":[{"AllowedOrigins":["https://arcadia.aptcodegen.online","http://localhost:3000"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","Content-Length","Content-Type"],"MaxAgeSeconds":3600}]}' >/tmp/cors.json
              mc cors set "arcadia/$MEDIA_S3_BUCKET" /tmp/cors.json || echo "cors skipped (mc/minio version)"
              echo "anonymous GetObject on $MEDIA_S3_BUCKET"
              echo "anonymous GetObject + CORS on $MEDIA_S3_BUCKET"
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MINIO_ROOT_USER}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MINIO_ROOT_PASSWORD}}}
            - {name: MEDIA_S3_BUCKET, valueFrom: {secretKeyRef: {name: arcadia-secrets, key: MEDIA_S3_BUCKET}}}
          resources:
            limits: {memory: 192Mi, cpu: 150m}
            requests: {memory: 96Mi, cpu: 50m}
