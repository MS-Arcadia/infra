apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespaces live in their own kustomization, applied before the overlays.
#
# They cannot sit in the base: an overlay that sets `namespace: arcadia-app` would rewrite
# the Namespace objects themselves, renaming arcadia-data to arcadia-app and colliding.
# Keeping them separate also matches how they are managed in practice — a namespace is
# cluster-level setup, created once, not something a service deploy touches.
#
#   kubectl apply -k deploy/k8s/namespaces
#   kubectl apply -k deploy/k8s/overlays/staging

resources:
  - namespaces.yaml
