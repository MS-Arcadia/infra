# Infrastructure pipeline.
#
# There is no Go here and nothing is compiled. All this checks is that the files which
# describe a deployment are actually valid, and that no real credential has been pasted
# into a committed Secret.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo "compose is valid"

      - name: Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 deploy/k8s/*.yaml

      - name: Committed secrets are still placeholders
        run: |
          # The Secret manifests are committed so the files apply on a fresh cluster. This
          # is the guard that stops a real credential being pasted into one.
          failed=0
          for f in deploy/k8s/*.yaml; do
            while IFS= read -r line; do
              case "$line" in
                *REPLACE*) ;;
                *) echo "$f: secret value without a placeholder: $line"; failed=1 ;;
              esac
            done < <(awk '/^stringData:/{s=1;next} /^[a-z-]/{s=0} s && /^  [A-Z_]+:/{print}' "$f")
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "all committed secrets are still placeholders"

      - name: Config files parse
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          bad = []
          for p in glob.glob('deploy/**/*.y*ml', recursive=True) + glob.glob('deploy/**/*.json', recursive=True):
              try:
                  (json.load if p.endswith('.json') else lambda f: list(yaml.safe_load_all(f)))(open(p))
              except Exception as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) or 'all config files parse')
          sys.exit(1 if bad else 0)
          PY
