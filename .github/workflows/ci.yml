# Infrastructure pipeline.
#
# Nothing here builds an image. What it protects is the shared surface: a change to the
# platform module or to a .proto file affects every service, so it has to be verified more
# carefully than a change inside one service.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'

permissions:
  contents: read

jobs:
  platform:
    name: Shared platform module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: platform/go.sum

      - name: Verify formatting
        working-directory: platform
        run: |
          # gen/ is generated by protoc, which formats it its own way.
          unformatted=$(gofmt -s -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Verify the module graph
        working-directory: platform
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        working-directory: platform
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1

      - name: Static analysis
        working-directory: platform
        run: staticcheck $(go list ./... | grep -v '/gen/')

      - name: Tests with the race detector
        working-directory: platform
        # The outbox dispatcher, the health registry and the rate limiter are all
        # concurrent. A data race here would be a race in every service.
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        working-directory: platform
        run: go tool cover -func=coverage.out | tail -30

  contracts:
    name: API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking needs history to compare against main.
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Lint
        working-directory: contracts
        run: buf lint

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        working-directory: contracts
        # Renaming or renumbering a field breaks every deployed consumer. This is the guard
        # that makes the contracts safe to depend on, and it must fail the PR rather than
        # be discovered after a deploy.
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=contracts"

      - name: Verify the generated code is up to date
        run: |
          cd contracts && buf generate && cd ..
          # The generated Go is committed so services build without a protobuf toolchain.
          # If this diff is non-empty, someone changed a .proto without regenerating.
          if ! git diff --exit-code platform/gen; then
            echo
            echo "The committed generated code does not match the .proto files."
            echo "Run 'make proto-gen' and commit the result."
            exit 1
          fi

  deployment:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo "compose file is valid"

      - name: Render the kustomize targets
        run: |
          for target in namespaces overlays/staging overlays/prod; do
            echo "--- $target"
            kubectl kustomize "deploy/k8s/$target" > /dev/null
          done
          echo "all kustomize targets render"

      - name: Validate the rendered manifests against the Kubernetes schema
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          for target in overlays/staging overlays/prod; do
            echo "--- $target"
            kubectl kustomize "deploy/k8s/$target" \
              | ./kubeconform -strict -summary -kubernetes-version 1.29.0 -
          done

      - name: Check the committed secrets are still placeholders
        run: |
          # The Secret manifests are committed so the manifests apply on a fresh cluster.
          # This is the guard that stops a real credential being pasted into one: every
          # stringData value must still carry a REPLACE placeholder.
          failed=0
          for f in $(find deploy/k8s -name secret.yaml); do
            # Every value line under stringData, excluding comments.
            while IFS= read -r line; do
              case "$line" in
                *REPLACE*) ;;
                *) echo "$f: value without a placeholder: $line"; failed=1 ;;
              esac
            done < <(awk '/^stringData:/{s=1;next} s && /^  [A-Z_]+:/{print}' "$f")
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "all committed secrets are still placeholders"

  yaml:
    name: Config files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse every YAML and JSON file
        run: |
          python - <<'PY'
          import glob, json, sys
          import yaml

          failed = []
          for path in glob.glob('deploy/**/*.y*ml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(path)))
              except Exception as exc:
                  failed.append((path, exc))
          for path in glob.glob('deploy/**/*.json', recursive=True):
              try:
                  json.load(open(path))
              except Exception as exc:
                  failed.append((path, exc))

          for path, exc in failed:
              print(f'FAILED {path}: {exc}')
          sys.exit(1 if failed else 0)
          PY
