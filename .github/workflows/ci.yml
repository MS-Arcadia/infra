# Infrastructure pipeline.
#
# There is no Go here and nothing is compiled. All this checks is that the files which
# describe a deployment are actually valid, and that no real credential has been
# committed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose config -q
          echo "compose is valid"

      - name: No real credentials committed
        run: |
          # Secrets live in deploy/compose/.env, which is gitignored. .env.example is
          # committed, so this is the guard that stops a real value being pasted into it.
          if git ls-files --error-unmatch deploy/compose/.env >/dev/null 2>&1; then
            echo "deploy/compose/.env is committed; it must stay local"
            exit 1
          fi
          failed=0
          while IFS='=' read -r key value; do
            case "$key" in ''|'#'*) continue ;; esac
            case "$key" in
              *SECRET*|*PASSWORD*|*PEPPER*|*API_KEY*|*TOKEN*) ;;
              *) continue ;;
            esac
            case "$value" in
              *change*|*replace*|*CHANGE*|*REPLACE*|'') ;;
              *) echo ".env.example: $key must stay an obvious placeholder"; failed=1 ;;
            esac
          done < deploy/compose/.env.example
          [ "$failed" -eq 0 ] || exit 1
          echo "no real credentials are committed"

      - name: Config files parse
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          bad = []
          for p in glob.glob('deploy/**/*.y*ml', recursive=True) + glob.glob('deploy/**/*.json', recursive=True):
              try:
                  (json.load if p.endswith('.json') else lambda f: list(yaml.safe_load_all(f)))(open(p))
              except Exception as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) or 'all config files parse')
          sys.exit(1 if bad else 0)
          PY
