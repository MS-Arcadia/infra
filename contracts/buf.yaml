version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Our RPCs return purpose-built response messages; a few of them are empty
    # today and that is fine — adding fields later stays wire compatible.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_STANDARD_NAME
    - PACKAGE_VERSION_SUFFIX
    # Debit/Credit/CaptureHold/Adjust all answer with TransactionResponse on
    # purpose: they are the same money-moved outcome and clients treat them
    # uniformly. Splitting them into four identical messages would be noise.
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
